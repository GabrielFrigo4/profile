[main]
term=foot
initial-color-theme=dark
font=JetBrainsMono Nerd Font:size=12.5,Hack Nerd Font:size=12.5,Hack:size=12.5,Noto Sans Mono:size=12.5,Adwaita Mono:size=12.5,Liberation Mono:size=12.5,Ubuntu Mono:size=12.5,DejaVu Sans Mono:size=12.5,Cascadia Code:size=12.5,Terminus:size=12.5,monospace:size=12.5
font-bold=JetBrainsMono Nerd Font:size=12.5:weight=bold,Hack:size=12.5:weight=bold,Noto Sans Mono:size=12.5:weight=bold,monospace:size=12.5:weight=bold
font-italic=JetBrainsMono Nerd Font:size=12.5:slant=italic,Hack:size=12.5:slant=italic,Noto Sans Mono:size=12.5:slant=italic,monospace:size=12.5:slant=italic
font-bold-italic=JetBrainsMono Nerd Font:size=12.5:weight=bold:slant=italic,Hack:size=12.5:weight=bold:slant=italic,Noto Sans Mono:size=12.5:weight=bold:slant=italic,monospace:size=12.5:weight=bold:slant=italic
line-height=22
letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0
underline-offset=2
underline-thickness=1.5
box-drawings-uses-font-glyphs=yes
dpi-aware=yes
pad=16x16

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors-dark]
alpha=0.98
background=1e1e1e
foreground=deddda
cursor=1e1e1e deddda

regular0=1e1e1e
regular1=ed333b
regular2=57e389
regular3=f8e45c
regular4=3584e4
regular5=9141ac
regular6=2a7b82
regular7=deddda

bright0=5e5c64
bright1=f66151
bright2=8ff0a4
bright3=f9f06b
bright4=62a0ea
bright5=c061cb
bright6=33c7de
bright7=ffffff

selection-foreground=ffffff
selection-background=3584e4

urls=62a0ea

[colors-light]
background=ffffff
foreground=2e3436
cursor=ffffff 2e3436

regular0=2e3436
regular1=cc0000
regular2=4e9a06
regular3=c4a000
regular4=3465a4
regular5=75507b
regular6=06989a
regular7=d3d7cf

bright0=555753
bright1=ef2929
bright2=8ae234
bright3=fce94f
bright4=729fcf
bright5=ad7fa8
bright6=34e2e2
bright7=eeeeec

selection-foreground=ffffff
selection-background=3584e4

urls=1c71d8

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+u
unicode-input=none
