[main]
term=foot
font=JetBrainsMono Nerd Font:size=13,JetBrains Mono:size=13,monospace:size=13
font-bold=JetBrainsMono Nerd Font:size=13:weight=bold
font-italic=JetBrainsMono Nerd Font:size=13:slant=italic
font-bold-italic=JetBrainsMono Nerd Font:size=13:weight=bold:slant=italic
line-height=20
letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0
underline-offset=2
underline-thickness=1.5
box-drawings-uses-font-glyphs=yes
dpi-aware=yes
pad=14x14

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors-dark]
alpha=0.96
background=16161d
foreground=dcd7ba
cursor=16161d ccd0da

regular0=090618
regular1=c34043
regular2=76946a
regular3=c0a36e
regular4=7e9cd8
regular5=957fb8
regular6=6a9589
regular7=c8c093

bright0=727169
bright1=e82424
bright2=98bb6c
bright3=e6c384
bright4=7fb4ca
bright5=938aa9
bright6=7aa89f
bright7=dcd7ba

selection-foreground=16161d
selection-background=7e9cd8

urls=7fb4ca

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+u
unicode-input=none
