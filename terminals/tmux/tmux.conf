# ================================================================
# tmux.conf: Universal Tmux Configuration & Kanagawa Theme
# ================================================================

# 1. Terminal, TrueColor & Latency
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB,kitty:RGB"
set -s escape-time 10
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 3

# 2. Ergonomia, Mouse & Janelas
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# 3. Propagação de Ambiente Antifrágil (Preserva TTY em Panes)
set -ag update-environment "RAW_TTY LC_RAW_TTY UNIVERSAL_RAW_TTY"

# 4. Atalhos de Divisão e Navegação
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message " Configuração recarregada!"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 5. Estilização Visual Kanagawa Dark
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1f1f28,fg=#dcd7ba"

set -g pane-border-style "fg=#2a2a37"
set -g pane-active-border-style "fg=#7e9cd8"

set -g message-style "bg=#2d4f67,fg=#c8c093"
set -g mode-style "bg=#2d4f67,fg=#c8c093"

set -g status-left "#[bg=#7e9cd8,fg=#16161d,bold] #S #[bg=#1f1f28,fg=#7e9cd8] "
set -g status-left-length 30

set -g status-right "#[bg=#1f1f28,fg=#727169] #(whoami)@#h #[bg=#2a2a37,fg=#957fb8] %H:%M #[bg=#957fb8,fg=#16161d,bold] %d/%m "
set -g status-right-length 60

setw -g window-status-format "#[fg=#727169] #I:#W "
setw -g window-status-current-format "#[bg=#2a2a37,fg=#98bb6c,bold] #I:#W "
