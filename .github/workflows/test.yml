name: Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    audit:
        name: 🔍 Static Audit & Domain Validation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Install Audit Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pyyaml

            - name: Run Profile Audit Suite
              run: PYTHONDONTWRITEBYTECODE=1 python3 .scripts/audit/all.py

            - name: Run Profile Domain Tests
              run: make test
